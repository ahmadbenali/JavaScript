<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>document.write Demo</title>
</head>
<body>
  <h1>Server Status Dashboard</h1>

  <script>
   
   let x=5;
   let y=10;

   let z=true;
   let w=false;

   console.log("x === y -> ",x===y);
   console.log("x == \"5\" -> ",x=="5");
   console.log("x !=y -> ",x!=y);
   
   console.log();

   console.log("x > y -> ",x>y);
   console.log("x < y -> ",x<y);
   console.log("x >= y -> ",x>=y);
   console.log("x <= y -> ",x<=y);

   console.log();

   console.log("z && w -> ",z&&w);
   console.log("z || w -> ",z||w);
   console.log("!(z -> w)",!(z||w));

  </script>

  <p>Static footer content that parses after the script completes.</p>
</body>
</html>
